# Python tests on macOS.
#
# Standalone (does not call the shared template) for two reasons:
#   * the shared macOS template installs python-casacore, which this package
#     does not use;
#   * casacoretables is compiled and needs bison>=3 / flex at build time.
#
# Uses conda (conda-forge) for the build tools, mirroring the package's
# development environment; the C++ compiler is the runner's system clang.
#
# Runs on pull requests and merges to main only (not on every branch push).
name: MacOS Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.rst'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: macos (py${{ matrix.python-version }})
    runs-on: macos-latest
    defaults:
      run:
        # -e: stop at the first failing command (plain `bash -l` would not).
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          activate-environment: test
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          conda-remove-defaults: "true"
          channel-priority: strict
          miniforge-version: latest

      - name: Install build tools (bison>=3, flex)
        run: conda install -n test -y bison flex

      - name: Build and install the package (+ test deps)
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run Python tests
        run: pytest -v tests/python/
