# Python tests on Linux.
#
# Standalone (does not call the shared template) because casacoretables is a
# compiled (C++/pybind11) package: it needs bison>=3 and flex at build time,
# which the pure-Python template does not install.
#
# Push to a branch: Python 3.13 only. Pull request / push to main: 3.12-3.14.
name: Linux Tests

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'

concurrency:
  # A newer push to the same branch/PR cancels the older run. Each run on main
  # gets its own group, so merges are never queued behind or cancelled by
  # each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: linux (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["3.13"]' || '["3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # bison>=3 / flex generate the TaQL and Json parsers; the C++ compiler,
      # CMake and Ninja are provided by the runner / scikit-build-core.
      - name: Install build tools (bison>=3, flex)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex

      - name: Build and install the package (+ test deps)
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run Python tests
        run: pytest -v tests/python/
